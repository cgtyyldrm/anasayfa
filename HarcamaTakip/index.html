<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Kasa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div id="auth-container" class="auth-wrapper">
        <div class="card auth-card">
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-wallet" style="font-size: 3rem; color: #6C63FF;"></i>
            </div>
            <h2 id="auth-title" style="text-align: center; margin-bottom: 20px;">Giriş Yap</h2>

            <form id="auth-form">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="username" required placeholder="adiniz">
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" class="btn-primary full-width">Giriş Yap</button>
            </form>

            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                <span id="auth-toggle-text">Hesabın yok mu?</span>
                <a href="#" id="auth-toggle-link" style="color: #6C63FF; font-weight: bold;">Kayıt Ol</a>
            </p>
        </div>
    </div>

    <div id="app-container" class="app-container hidden">
        <header>
            <div class="logo">
                <i class="fa-solid fa-wallet"></i>
                <h1>Cüzdanım: <span id="user-display" style="color:#6C63FF;"></span></h1>
            </div>
            <div class="header-actions">
                <button id="logout-btn" class="btn-secondary" style="color: #FF6584;">
                    <i class="fa-solid fa-right-from-bracket"></i> Çıkış
                </button>
            </div>
        </header>

        <main>
            <section class="dashboard">
                <div class="card total-card" style="padding: 40px 20px;">
                    <h3 style="font-size: 1.2rem; opacity: 0.8;">Mevcut Bakiyem</h3>
                    <div class="amount" id="total-balance" style="font-size: 3.5rem;">0.00 ₺</div>
                    <div id="balance-status" style="margin-top: 10px; font-size: 0.9rem;">Durum Hesaplanıyor...</div>
                </div>
            </section>

            <section class="actions">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <button id="add-income-btn" class="btn-primary" style="background-color: #43D9AD; flex: 1;">
                        <i class="fa-solid fa-arrow-down"></i> Para Girişi
                    </button>
                    <button id="add-expense-btn" class="btn-primary" style="background-color: #FF6584; flex: 1;">
                        <i class="fa-solid fa-arrow-up"></i> Harcama
                    </button>
                </div>
            </section>

            <section class="recent-expenses">
                <h2>Hareketler</h2>
                <div class="expense-list" id="expense-list"></div>
            </section>
        </main>
    </div>

    <div id="expense-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Harcama Yap</h2><button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="expense-form">
                <div class="form-group"><label>Tutar (₺)</label><input type="number" id="amount" step="0.5" required>
                </div>
                <div class="form-group"><label>Kategori</label>
                    <select id="category" required>
                        <option value="food">Yemek</option>
                        <option value="transport">Ulaşım</option>
                        <option value="entertainment">Eğlence</option>
                        <option value="education">Eğitim</option>
                        <option value="clothing">Giyim</option>
                        <option value="other">Diğer</option>
                    </select>
                </div>
                <div class="form-group"><label>Tarih</label><input type="date" id="date" required></div>
                <div class="form-group"><label>Açıklama</label><input type="text" id="description"></div>
                <button type="submit" class="btn-primary full-width" style="background-color: #FF6584;">Harcamayı Kaydet
                    (-)</button>
            </form>
        </div>
    </div>

    <div id="income-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Para Girişi</h2><button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="income-form">
                <div class="form-group"><label>Miktar (₺)</label><input type="number" id="income-amount" step="0.5"
                        required></div>
                <div class="form-group"><label>Tarih</label><input type="date" id="income-date" required></div>
                <div class="form-group"><label>Not / Kaynak</label><input type="text" id="income-description"
                        placeholder="Örn: Maaş, Harçlık"></div>
                <button type="submit" class="btn-primary full-width" style="background-color: #43D9AD;">Cüzdana Ekle
                    (+)</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
